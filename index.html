<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Inventory</title>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f5f5f5;
    color: #222;
}

header {
    background: #111;
    color: white;
    padding: 20px;
}

header h1 {
    margin: 0;
    font-size: 24px;
}

.container {
    padding: 20px;
    max-width: 700px;
    margin: auto;
}

input,
select,
button {
    width: 100%;
    padding: 13px;
    margin-bottom: 12px;
    box-sizing: border-box;
    font-size: 16px;
    border-radius: 8px;
    border: 1px solid #ccc;
}

button {
    background: #111;
    color: white;
    border: none;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(0.98);
}

.categories {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    margin-bottom: 15px;
}

.categories button {
    min-width: 100px;
    margin: 0;
}

.product {
    background: white;
    padding: 16px;
    margin-bottom: 12px;
    border-radius: 10px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.08);
}

.product h3 {
    margin-top: 0;
    margin-bottom: 5px;
}

.product p {
    margin: 5px 0;
}

.small {
    color: #777;
    font-size: 14px;
}

.barcode-text {
    font-family: monospace;
    font-size: 14px;
    color: #555;
}

.count-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin: 10px 0;
}

.count-label {
    flex: 1;
}

.count-controls {
    display: flex;
    align-items: center;
    gap: 6px;
}

.count-button {
    width: 42px;
    height: 42px;
    padding: 0;
    margin: 0;
    font-size: 22px;
    border-radius: 8px;
    background: #111;
}

.count-value {
    min-width: 45px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
}

.product-update-button {
    margin-top: 10px;
}

#addProductForm,
#updateForm,
#historyPanel {
    background: white;
    padding: 20px;
    border-radius: 10px;
    margin-top: 20px;
}

#scannerContainer {
    display: none;
    background: white;
    padding: 20px;
    border-radius: 10px;
    margin-top: 20px;
    margin-bottom: 20px;
}

#scannerContainer h2 {
    margin-top: 0;
}

#reader {
    width: 100%;
    overflow: hidden;
    border-radius: 10px;
    margin-bottom: 12px;
}

#reader video {
    width: 100% !important;
    height: auto !important;
    border-radius: 10px;
}

#scannerStatus {
    text-align: center;
    color: #777;
    font-size: 14px;
    margin-bottom: 12px;
    min-height: 20px;
}

#closeScannerButton {
    background: #555;
}

#newBarcodePrompt {
    display: none;
    background: white;
    padding: 20px;
    border-radius: 10px;
    margin-top: 20px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
}

#newBarcodePrompt h2 {
    margin-top: 0;
    margin-bottom: 10px;
}

#newBarcodeNumber {
    background: #f5f5f5;
    padding: 12px;
    border-radius: 8px;
    font-family: monospace;
    font-size: 16px;
    word-break: break-all;
    margin-bottom: 15px;
}

#newBarcodePrompt .cancel-button,
#historyPanel .close-history {
    background: #555;
}

.history-entry {
    border-top: 1px solid #ddd;
    padding: 12px 0;
}

.history-entry:first-child {
    border-top: none;
}

.history-date {
    font-size: 13px;
    color: #777;
    margin-bottom: 4px;
}

.history-change {
    font-weight: bold;
}

.empty-history {
    color: #777;
    font-size: 14px;
}

.danger-button {
    background: #b00020;
}

.secondary-button {
    background: #555;
}

.section-title {
    margin-top: 0;
}

@media (max-width: 500px) {
    .container {
        padding: 15px;
    }

    .count-row {
        align-items: center;
    }

    .count-label {
        font-size: 15px;
    }
}
</style>
</head>

<body>

<header>
    <h1>My Inventory</h1>
</header>

<div class="container">

    <input
        id="searchInput"
        type="text"
        placeholder="Search products..."
    >

    <button onclick="scanBarcode()">Scan Barcode</button>

    <button onclick="showAddProduct()">Add Product</button>


    <!-- BARCODE SCANNER -->

    <div id="scannerContainer">

        <h2>Scan Barcode</h2>

        <div id="reader"></div>

        <div id="scannerStatus">
            Point your camera at a product barcode.
        </div>

        <button
            id="closeScannerButton"
            onclick="closeBarcodeScanner()"
        >
            Close Scanner
        </button>

    </div>


    <!-- NEW BARCODE PROMPT -->

    <div id="newBarcodePrompt">

        <h2>New Product Found</h2>

        <p>
            This barcode isn't in your inventory yet.
        </p>

        <div id="newBarcodeNumber"></div>

        <button onclick="addScannedProduct()">
            Add Product
        </button>

        <button
            class="cancel-button"
            onclick="cancelScannedProduct()"
        >
            Cancel
        </button>

    </div>


    <!-- CATEGORY FILTERS -->

    <div class="categories">

        <button onclick="filterProducts('All')">
            All
        </button>

        <button onclick="filterProducts('Skincare')">
            Skincare
        </button>

        <button onclick="filterProducts('Makeup')">
            Makeup
        </button>

        <button onclick="filterProducts('Haircare')">
            Haircare
        </button>

    </div>


    <!-- PRODUCT LIST -->

    <div id="productList"></div>


    <!-- ADD PRODUCT -->

    <div
        id="addProductForm"
        style="display:none;"
    >

        <h2 class="section-title">
            Add Product
        </h2>

        <input
            id="newName"
            type="text"
            placeholder="Product name"
        >

        <select id="newCategory">

            <option value="Skincare">
                Skincare
            </option>

            <option value="Makeup">
                Makeup
            </option>

            <option value="Haircare">
                Haircare
            </option>

        </select>

        <input
            id="newBarcode"
            type="text"
            placeholder="Barcode (optional)"
        >

        <input
            id="newStock"
            type="number"
            min="0"
            placeholder="Live stock"
        >

        <input
            id="newTester"
            type="number"
            min="0"
            placeholder="Testers"
        >

        <input
            id="newSamples"
            type="number"
            min="0"
            placeholder="Samples"
        >

        <button onclick="saveNewProduct()">
            Save Product
        </button>

        <button
            class="secondary-button"
            onclick="closeAddProduct()"
        >
            Cancel
        </button>

    </div>


    <!-- UPDATE COUNT -->

    <div
        id="updateForm"
        style="display:none;"
    >

        <h2 class="section-title">
            Update Count
        </h2>

        <p
            id="updateProductName"
            class="small"
        ></p>


        <label>
            Live Stock
        </label>

        <div class="count-row">

            <div class="count-label">
                Quick Count
            </div>

            <div class="count-controls">

                <button
                    class="count-button"
                    onclick="changeCount('stock', -1)"
                >
                    −
                </button>

                <div
                    id="quickStockValue"
                    class="count-value"
                >
                    0
                </div>

                <button
                    class="count-button"
                    onclick="changeCount('stock', 1)"
                >
                    +
                </button>

            </div>

        </div>

        <input
            id="updateStock"
            type="number"
            min="0"
            placeholder="Live stock"
        >


        <label>
            Testers
        </label>

        <div class="count-row">

            <div class="count-label">
                Quick Count
            </div>

            <div class="count-controls">

                <button
                    class="count-button"
                    onclick="changeCount('tester', -1)"
                >
                    −
                </button>

                <div
                    id="quickTesterValue"
                    class="count-value"
                >
                    0
                </div>

                <button
                    class="count-button"
                    onclick="changeCount('tester', 1)"
                >
                    +
                </button>

            </div>

        </div>

        <input
            id="updateTester"
            type="number"
            min="0"
            placeholder="Testers"
        >


        <label>
            Samples
        </label>

        <div class="count-row">

            <div class="count-label">
                Quick Count
            </div>

            <div class="count-controls">

                <button
                    class="count-button"
                    onclick="changeCount('samples', -1)"
                >
                    −
                </button>

                <div
                    id="quickSamplesValue"
                    class="count-value"
                >
                    0
                </div>

                <button
                    class="count-button"
                    onclick="changeCount('samples', 1)"
                >
                    +
                </button>

            </div>

        </div>

        <input
            id="updateSamples"
            type="number"
            min="0"
            placeholder="Samples"
        >


        <button onclick="saveUpdate()">
            Save Changes
        </button>

        <button onclick="showHistory()">
            View Count History
        </button>

        <button
            class="danger-button"
            onclick="deleteProduct()"
        >
            Delete Product
        </button>

        <button
            class="secondary-button"
            onclick="closeUpdate()"
        >
            Cancel
        </button>

    </div>


    <!-- HISTORY -->

    <div
        id="historyPanel"
        style="display:none;"
    >

        <h2 class="section-title">
            Count History
        </h2>

        <div id="historyList"></div>

        <button
            class="close-history"
            onclick="closeHistory()"
        >
            Close History
        </button>

    </div>

</div>


<script>

var currentProduct = null;

var currentCategory = "All";

var barcodeScanner = null;

var barcodeScannerRunning = false;

var barcodeAlreadyFound = false;

var pendingScannedBarcode = "";


/*
==================================================
DEFAULT PRODUCTS
==================================================
*/

var defaultProducts = [

    {
        id: "default-1",
        name: "Hydra Balance Serum",
        category: "Skincare",
        barcode: "",
        stock: "8",
        tester: "2",
        samples: "5",
        lastChecked: new Date().toISOString(),
        history: []
    },

    {
        id: "default-2",
        name: "Velvet Skin Foundation",
        category: "Makeup",
        barcode: "",
        stock: "12",
        tester: "1",
        samples: "3",
        lastChecked: new Date().toISOString(),
        history: []
    },

    {
        id: "default-3",
        name: "Nourishing Hair Mask",
        category: "Haircare",
        barcode: "",
        stock: "6",
        tester: "1",
        samples: "4",
        lastChecked: new Date().toISOString(),
        history: []
    }

];


/*
==================================================
GET PRODUCTS
==================================================
*/

function getProducts() {

    var savedProducts =
        JSON.parse(
            localStorage.getItem("inventoryProducts")
        );

    if (!savedProducts) {

        savedProducts = defaultProducts;

        localStorage.setItem(
            "inventoryProducts",
            JSON.stringify(savedProducts)
        );

    }

    /*
    Upgrade older products that don't yet have
    lastChecked or history.
    */

    var changed = false;

    savedProducts.forEach(function(product) {

        if (!product.id) {

            product.id =
                "product-" +
                Date.now() +
                "-" +
                Math.random()
                    .toString(36)
                    .substring(2, 8);

            changed = true;

        }

        if (!product.hasOwnProperty("lastChecked")) {

            product.lastChecked = null;

            changed = true;

        }

        if (!Array.isArray(product.history)) {

            product.history = [];

            changed = true;

        }

    });


    if (changed) {

        localStorage.setItem(
            "inventoryProducts",
            JSON.stringify(savedProducts)
        );

    }


    return savedProducts;

}


/*
==================================================
SAVE PRODUCTS
==================================================
*/

function saveProducts(products) {

    localStorage.setItem(
        "inventoryProducts",
        JSON.stringify(products)
    );

}


/*
==================================================
FORMAT DATE
==================================================
*/

function formatDate(dateString) {

    if (!dateString) {
        return "Never";
    }

    var date = new Date(dateString);

    if (isNaN(date.getTime())) {
        return "Never";
    }

    return date.toLocaleString([], {
        month: "short",
        day: "numeric",
        year: "numeric",
        hour: "numeric",
        minute: "2-digit"
    });

}


/*
==================================================
RENDER PRODUCTS
==================================================
*/

function renderProducts() {

    var productList =
        document.getElementById("productList");

    productList.innerHTML = "";

    var products = getProducts();

    var searchText =
        document
            .getElementById("searchInput")
            .value
            .toLowerCase()
            .trim();


    var visibleCount = 0;


    products.forEach(function(product) {

        var nameMatches =
            product.name
                .toLowerCase()
                .includes(searchText);

        var categoryMatches =
            currentCategory === "All" ||
            product.category === currentCategory;


        if (!nameMatches || !categoryMatches) {
            return;
        }


        visibleCount++;


        var productDiv =
            document.createElement("div");

        productDiv.className = "product";

        productDiv.setAttribute(
            "data-id",
            product.id
        );


        var barcodeText =
            product.barcode
                ? product.barcode
                : "None";


        productDiv.innerHTML =

            "<h3>" +
            escapeHtml(product.name) +
            "</h3>" +

            "<p class='small'>" +
            escapeHtml(product.category) +
            "</p>" +

            "<p class='barcode-text'>" +
            "Barcode: " +
            escapeHtml(barcodeText) +
            "</p>" +

            "<div class='count-row'>" +

                "<div class='count-label'>" +
                    "Live Stock" +
                "</div>" +

                "<div class='count-controls'>" +

                    "<button " +
                        "class='count-button' " +
                        "onclick='quickChange(\"" +
                        product.id +
                        "\", \"stock\", -1)' " +
                    ">" +
                        "−" +
                    "</button>" +

                    "<div class='count-value'>" +
                        product.stock +
                    "</div>" +

                    "<button " +
                        "class='count-button' " +
                        "onclick='quickChange(\"" +
                        product.id +
                        "\", \"stock\", 1)' " +
                    ">" +
                        "+" +
                    "</button>" +

                "</div>" +

            "</div>" +


            "<div class='count-row'>" +

                "<div class='count-label'>" +
                    "Testers" +
                "</div>" +

                "<div class='count-controls'>" +

                    "<button " +
                        "class='count-button' " +
                        "onclick='quickChange(\"" +
                        product.id +
                        "\", \"tester\", -1)' " +
                    ">" +
                        "−" +
                    "</button>" +

                    "<div class='count-value'>" +
                        product.tester +
                    "</div>" +

                    "<button " +
                        "class='count-button' " +
                        "onclick='quickChange(\"" +
                        product.id +
                        "\", \"tester\", 1)' " +
                    ">" +
                        "+" +
                    "</button>" +

                "</div>" +

            "</div>" +


            "<div class='count-row'>" +

                "<div class='count-label'>" +
                    "Samples" +
                "</div>" +

                "<div class='count-controls'>" +

                    "<button " +
                        "class='count-button' " +
                        "onclick='quickChange(\"" +
                        product.id +
                        "\", \"samples\", -1)' " +
                    ">" +
                        "−" +
                    "</button>" +

                    "<div class='count-value'>" +
                        product.samples +
                    "</div>" +

                    "<button " +
                        "class='count-button' " +
                        "onclick='quickChange(\"" +
                        product.id +
                        "\", \"samples\", 1)' " +
                    ">" +
                        "+" +
                    "</button>" +

                "</div>" +

            "</div>" +


            "<p class='small'>" +
            "Last checked: " +
            formatDate(product.lastChecked) +
            "</p>" +


            "<button " +
                "class='product-update-button' " +
                "onclick='openUpdateById(\"" +
                product.id +
                "\")'>" +
                "Update Count" +
            "</button>";


        productList.appendChild(productDiv);

    });


    if (visibleCount === 0) {

        productList.innerHTML =
            "<div class='product'>" +
            "<p>No products found.</p>" +
            "</div>";

    }

}


/*
==================================================
ESCAPE HTML
==================================================
*/

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/*
==================================================
SEARCH
==================================================
*/

document
    .getElementById("searchInput")
    .addEventListener(
        "input",
        function() {
            renderProducts();
        }
    );


/*
==================================================
CATEGORY FILTER
==================================================
*/

function filterProducts(category) {

    currentCategory = category;

    renderProducts();

}


/*
==================================================
ADD PRODUCT
==================================================
*/

function showAddProduct() {

    document
        .getElementById("addProductForm")
        .style.display = "block";

}


function closeAddProduct() {

    document
        .getElementById("addProductForm")
        .style.display = "none";

}


function saveNewProduct() {

    var product = {

        id:
            "product-" +
            Date.now(),

        name:
            document
                .getElementById("newName")
                .value
                .trim(),

        category:
            document
                .getElementById("newCategory")
                .value,

        barcode:
            document
                .getElementById("newBarcode")
                .value
                .trim(),

        stock:
            document
                .getElementById("newStock")
                .value || "0",

        tester:
            document
                .getElementById("newTester")
                .value || "0",

        samples:
            document
                .getElementById("newSamples")
                .value || "0",

        lastChecked:
            new Date().toISOString(),

        history: []

    };


    if (product.name === "") {

        alert(
            "Please enter a product name."
        );

        return;

    }


    var products = getProducts();


    /*
    Check duplicate barcode.
    */

    if (product.barcode !== "") {

        var duplicateBarcode =
            products.find(
                function(existingProduct) {

                    return (
                        existingProduct.barcode &&
                        String(
                            existingProduct.barcode
                        ).trim() ===
                        product.barcode
                    );

                }
            );


        if (duplicateBarcode) {

            alert(
                "A product with this barcode already exists."
            );

            return;

        }

    }


    products.push(product);

    saveProducts(products);

    closeAddProduct();

    clearAddProductForm();

    pendingScannedBarcode = "";

    renderProducts();

    alert("Product added!");

}


/*
==================================================
CLEAR ADD PRODUCT FORM
==================================================
*/

function clearAddProductForm() {

    document
        .getElementById("newName")
        .value = "";

    document
        .getElementById("newBarcode")
        .value = "";

    document
        .getElementById("newStock")
        .value = "";

    document
        .getElementById("newTester")
        .value = "";

    document
        .getElementById("newSamples")
        .value = "";

}


/*
==================================================
OPEN UPDATE BY ID
==================================================
*/

function openUpdateById(productId) {

    var products = getProducts();

    var product =
        products.find(
            function(item) {
                return item.id === productId;
            }
        );


    if (!product) {

        alert(
            "Product could not be found."
        );

        return;

    }


    currentProduct = product;


    document
        .getElementById("updateProductName")
        .textContent =
            product.name +
            " • " +
            product.category;


    document
        .getElementById("updateStock")
        .value =
            product.stock;


    document
        .getElementById("updateTester")
        .value =
            product.tester;


    document
        .getElementById("updateSamples")
        .value =
            product.samples;


    updateQuickValues();


    document
        .getElementById("updateForm")
        .style.display = "block";


    document
        .getElementById("historyPanel")
        .style.display = "none";

}


/*
==================================================
QUICK COUNT VALUES
==================================================
*/

function updateQuickValues() {

    if (!currentProduct) {
        return;
    }


    document
        .getElementById("quickStockValue")
        .textContent =
            document
                .getElementById("updateStock")
                .value || "0";


    document
        .getElementById("quickTesterValue")
        .textContent =
            document
                .getElementById("updateTester")
                .value || "0";


    document
        .getElementById("quickSamplesValue")
        .textContent =
            document
                .getElementById("updateSamples")
                .value || "0";

}


/*
==================================================
QUICK + / - INSIDE UPDATE SCREEN
==================================================
*/

function changeCount(field, amount) {

    if (!currentProduct) {
        return;
    }


    var inputId;


    if (field === "stock") {
        inputId = "updateStock";
    }

    if (field === "tester") {
        inputId = "updateTester";
    }

    if (field === "samples") {
        inputId = "updateSamples";
    }


    var input =
        document.getElementById(inputId);


    var currentValue =
        parseInt(input.value, 10);


    if (isNaN(currentValue)) {
        currentValue = 0;
    }


    var newValue =
        currentValue + amount;


    if (newValue < 0) {
        newValue = 0;
    }


    input.value = newValue;

    updateQuickValues();

}


/*
==================================================
QUICK COUNT DIRECTLY FROM PRODUCT CARD
==================================================
*/

function quickChange(
    productId,
    field,
    amount
) {

    var products = getProducts();


    var index =
        products.findIndex(
            function(product) {
                return product.id === productId;
            }
        );


    if (index === -1) {

        alert(
            "Product could not be found."
        );

        return;

    }


    var product = products[index];


    var oldValue =
        parseInt(product[field], 10);


    if (isNaN(oldValue)) {
        oldValue = 0;
    }


    var newValue =
        oldValue + amount;


    if (newValue < 0) {
        newValue = 0;
    }


    /*
    Nothing to do if user presses minus
    when count is already zero.
    */

    if (newValue === oldValue) {
        return;
    }


    product[field] =
        String(newValue);


    var now =
        new Date().toISOString();


    product.lastChecked = now;


    if (!Array.isArray(product.history)) {
        product.history = [];
    }


    product.history.unshift({

        date: now,

        type: "Quick Count",

        field: field,

        oldValue: String(oldValue),

        newValue: String(newValue),

        change:
            amount > 0
                ? "+" + amount
                : String(amount)

    });


    /*
    Keep history from becoming enormous.
    */

    if (product.history.length > 100) {

        product.history =
            product.history.slice(0, 100);

    }


    saveProducts(products);

    renderProducts();


    /*
    If this product is currently open in the
    Update Count screen, keep it synchronized.
    */

    if (
        currentProduct &&
        currentProduct.id === productId
    ) {

        currentProduct = product;

        document
            .getElementById("updateStock")
            .value =
                product.stock;

        document
            .getElementById("updateTester")
            .value =
                product.tester;

        document
            .getElementById("updateSamples")
            .value =
                product.samples;

        updateQuickValues();

    }

}


/*
==================================================
SAVE UPDATE
==================================================
*/

function saveUpdate() {

    if (!currentProduct) {
        return;
    }


    var newStock =
        document
            .getElementById("updateStock")
            .value || "0";


    var newTester =
        document
            .getElementById("updateTester")
            .value || "0";


    var newSamples =
        document
            .getElementById("updateSamples")
            .value || "0";


    var products = getProducts();


    var index =
        products.findIndex(
            function(product) {
                return (
                    product.id ===
                    currentProduct.id
                );
            }
        );


    if (index === -1) {

        alert(
            "Product could not be found."
        );

        return;

    }


    var product = products[index];

    var now =
        new Date().toISOString();


    /*
    Record changes.
    */

    var changes = [];


    if (
        String(product.stock) !==
        String(newStock)
    ) {

        changes.push({
            field: "Live Stock",
            oldValue: product.stock,
            newValue: newStock
        });

    }


    if (
        String(product.tester) !==
        String(newTester)
    ) {

        changes.push({
            field: "Testers",
            oldValue: product.tester,
            newValue: newTester
        });

    }


    if (
        String(product.samples) !==
        String(newSamples)
    ) {

        changes.push({
            field: "Samples",
            oldValue: product.samples,
            newValue: newSamples
        });

    }


    /*
    Save the new counts.
    */

    product.stock = newStock;

    product.tester = newTester;

    product.samples = newSamples;


    /*
    Only change the last-checked time if
    something actually changed.
    */

    if (changes.length > 0) {

        product.lastChecked = now;


        if (!Array.isArray(product.history)) {
            product.history = [];
        }


        changes.forEach(
            function(change) {

                var oldNumber =
                    parseInt(
                        change.oldValue,
                        10
                    );

                var newNumber =
                    parseInt(
                        change.newValue,
                        10
                    );


                var difference =
                    newNumber -
                    oldNumber;


                var differenceText =
                    difference > 0
                        ? "+" + difference
                        : String(difference);


                product.history.unshift({

                    date: now,

                    type: "Manual Update",

                    field:
                        change.field,

                    oldValue:
                        String(
                            change.oldValue
                        ),

                    newValue:
                        String(
                            change.newValue
                        ),

                    change:
                        differenceText

                });

            }
        );


        if (product.history.length > 100) {

            product.history =
                product.history.slice(0, 100);

        }

    }


    saveProducts(products);


    currentProduct = product;


    renderProducts();


    alert(
        changes.length > 0
            ? "Count updated!"
            : "No changes were made."
    );

}


/*
==================================================
COUNT HISTORY
==================================================
*/

function showHistory() {

    if (!currentProduct) {
        return;
    }


    var products = getProducts();


    var product =
        products.find(
            function(item) {
                return (
                    item.id ===
                    currentProduct.id
                );
            }
        );


    if (!product) {

        alert(
            "Product could not be found."
        );

        return;

    }


    currentProduct = product;


    var historyList =
        document.getElementById(
            "historyList"
        );


    historyList.innerHTML = "";


    if (
        !Array.isArray(product.history) ||
        product.history.length === 0
    ) {

        historyList.innerHTML =
            "<p class='empty-history'>" +
            "No count history yet." +
            "</p>";

    }
    else {

        product.history.forEach(
            function(entry) {

                var entryDiv =
                    document.createElement(
                        "div"
                    );


                entryDiv.className =
                    "history-entry";


                var actionText =
                    entry.change === "0"
                        ? "changed"
                        : entry.change;


                entryDiv.innerHTML =

                    "<div class='history-date'>" +
                    escapeHtml(
                        formatDate(
                            entry.date
                        )
                    ) +
                    "</div>" +

                    "<div class='history-change'>" +
                    escapeHtml(
                        entry.field
                    ) +
                    " " +
                    escapeHtml(
                        actionText
                    ) +
                    " (" +
                    escapeHtml(
                        entry.oldValue
                    ) +
                    " → " +
                    escapeHtml(
                        entry.newValue
                    ) +
                    ")" +
                    "</div>" +

                    "<div class='small'>" +
                    escapeHtml(
                        entry.type
                    ) +
                    "</div>";


                historyList.appendChild(
                    entryDiv
                );

            }
        );

    }


    document
        .getElementById("historyPanel")
        .style.display = "block";

}


function closeHistory() {

    document
        .getElementById("historyPanel")
        .style.display = "none";

}


/*
==================================================
DELETE PRODUCT
==================================================
*/

function deleteProduct() {

    if (!currentProduct) {

        alert(
            "No product selected."
        );

        return;

    }


    var productName =
        currentProduct.name;


    var confirmed =
        confirm(
            "Are you sure you want to delete " +
            productName +
            "?"
        );


    if (!confirmed) {
        return;
    }


    var products = getProducts();


    products =
        products.filter(
            function(product) {

                return (
                    product.id !==
                    currentProduct.id
                );

            }
        );


    saveProducts(products);


    currentProduct = null;


    closeUpdate();

    closeHistory();

    renderProducts();


    alert(
        "Product deleted."
    );

}


/*
==================================================
CLOSE UPDATE
==================================================
*/

function closeUpdate() {

    document
        .getElementById("updateForm")
        .style.display = "none";


    document
        .getElementById("historyPanel")
        .style.display = "none";


    currentProduct = null;

}


/*
==================================================
BARCODE SCANNER
==================================================
*/

function scanBarcode() {

    if (
        typeof Html5Qrcode ===
        "undefined"
    ) {

        alert(
            "The barcode scanner could not load. Please check your internet connection and try again."
        );

        return;

    }


    if (barcodeScannerRunning) {
        return;
    }


    barcodeAlreadyFound = false;


    document
        .getElementById(
            "scannerContainer"
        )
        .style.display = "block";


    document
        .getElementById(
            "scannerStatus"
        )
        .textContent =
            "Starting camera...";


    document
        .getElementById("reader")
        .innerHTML = "";


    barcodeScanner =
        new Html5Qrcode("reader");


    var formats = [

        Html5QrcodeSupportedFormats.UPC_A,

        Html5QrcodeSupportedFormats.UPC_E,

        Html5QrcodeSupportedFormats.EAN_13,

        Html5QrcodeSupportedFormats.EAN_8,

        Html5QrcodeSupportedFormats.CODE_128,

        Html5QrcodeSupportedFormats.CODE_39,

        Html5QrcodeSupportedFormats.ITF,

        Html5QrcodeSupportedFormats.CODABAR

    ];


    var scannerConfig = {

        fps: 15,

        qrbox:
            function(
                viewfinderWidth,
                viewfinderHeight
            ) {

                var width =
                    Math.floor(
                        viewfinderWidth *
                        0.90
                    );


                var height =
                    Math.floor(
                        viewfinderHeight *
                        0.35
                    );


                return {
                    width: width,
                    height: height
                };

            },

        aspectRatio:
            1.7777778,

        formatsToSupport:
            formats,

        experimentalFeatures: {
            useBarCodeDetectorIfSupported:
                true
        }

    };


    barcodeScanner
        .start(

            {
                facingMode: {
                    exact: "environment"
                }
            },

            scannerConfig,

            function(
                decodedText,
                decodedResult
            ) {

                onBarcodeScanned(
                    decodedText
                );

            },

            function(errorMessage) {}

        )

        .then(
            function() {

                barcodeScannerRunning =
                    true;


                document
                    .getElementById(
                        "scannerStatus"
                    )
                    .textContent =
                        "Move the barcode into the box. Keep it flat and well lit.";

            }
        )

        .catch(
            function(error) {

                console.error(
                    "Barcode scanner error:",
                    error
                );


                document
                    .getElementById(
                        "scannerStatus"
                    )
                    .textContent =
                        "Camera could not start.";


                alert(
                    "The camera could not be started. Please make sure your browser has camera permission."
                );


                closeBarcodeScanner();

            }
        );

}


/*
==================================================
BARCODE FOUND
==================================================
*/

function onBarcodeScanned(
    decodedText
) {

    if (barcodeAlreadyFound) {
        return;
    }


    if (!decodedText) {
        return;
    }


    barcodeAlreadyFound = true;


    var scannedBarcode =
        String(decodedText).trim();


    document
        .getElementById(
            "scannerStatus"
        )
        .textContent =
            "Barcode found: " +
            scannedBarcode;


    stopBarcodeScanner()
        .then(
            function() {

                handleScannedBarcode(
                    scannedBarcode
                );

            }
        );

}


/*
==================================================
HANDLE SCANNED BARCODE
==================================================
*/

function handleScannedBarcode(
    scannedBarcode
) {

    var products =
        getProducts();


    var existingProduct =
        products.find(
            function(product) {

                return (
                    product.barcode &&
                    String(
                        product.barcode
                    ).trim() ===
                    scannedBarcode
                );

            }
        );


    if (existingProduct) {

        closeBarcodeScanner();


        currentCategory = "All";


        document
            .getElementById(
                "searchInput"
            )
            .value = "";


        renderProducts();


        openUpdateById(
            existingProduct.id
        );


        alert(
            "Product found: " +
            existingProduct.name
        );


        return;

    }


    /*
    New barcode.
    */

    pendingScannedBarcode =
        scannedBarcode;


    closeBarcodeScanner();


    document
        .getElementById(
            "newBarcodeNumber"
        )
        .textContent =
            scannedBarcode;


    document
        .getElementById(
            "newBarcodePrompt"
        )
        .style.display =
            "block";

}


/*
==================================================
ADD SCANNED PRODUCT
==================================================
*/

function addScannedProduct() {

    if (!pendingScannedBarcode) {
        return;
    }


    document
        .getElementById(
            "newBarcodePrompt"
        )
        .style.display =
            "none";


    showAddProduct();


    document
        .getElementById(
            "newBarcode"
        )
        .value =
            pendingScannedBarcode;


    document
        .getElementById(
            "newName"
        )
        .focus();

}


/*
==================================================
CANCEL SCANNED PRODUCT
==================================================
*/

function cancelScannedProduct() {

    pendingScannedBarcode = "";


    document
        .getElementById(
            "newBarcodePrompt"
        )
        .style.display =
            "none";

}


/*
==================================================
STOP BARCODE SCANNER
==================================================
*/

function stopBarcodeScanner() {

    return new Promise(
        function(resolve) {

            if (!barcodeScanner) {

                barcodeScannerRunning =
                    false;

                resolve();

                return;

            }


            barcodeScanner
                .stop()

                .then(
                    function() {

                        barcodeScannerRunning =
                            false;

                        barcodeScanner =
                            null;


                        document
                            .getElementById(
                                "reader"
                            )
                            .innerHTML = "";


                        resolve();

                    }
                )

                .catch(
                    function(error) {

                        console.error(
                            "Scanner stop error:",
                            error
                        );


                        barcodeScannerRunning =
                            false;

                        barcodeScanner =
                            null;


                        document
                            .getElementById(
                                "reader"
                            )
                            .innerHTML = "";


                        resolve();

                    }
                );

        }
    );

}


/*
==================================================
CLOSE BARCODE SCANNER
==================================================
*/

function closeBarcodeScanner() {

    stopBarcodeScanner();


    document
        .getElementById(
            "scannerContainer"
        )
        .style.display =
            "none";


    document
        .getElementById(
            "scannerStatus"
        )
        .textContent =
            "Point your camera at a product barcode.";

}


/*
==================================================
INITIALIZE APP
==================================================
*/

window.addEventListener(
    "load",
    function() {

        /*
        Upgrade any older saved products.
        */

        getProducts();


        renderProducts();

    }
);

</script>

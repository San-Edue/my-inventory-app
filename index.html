<!DOCTYPE html>
<html>

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Inventory</title>

  <!-- Barcode scanner library -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    .container {
      padding: 20px;
      max-width: 700px;
      margin: auto;
    }

    input, select, button {
      width: 100%;
      padding: 13px;
      margin-bottom: 12px;
      box-sizing: border-box;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      background: #111;
      color: white;
      border: none;
      font-weight: bold;
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 15px;
    }

    .categories button {
      min-width: 100px;
      margin: 0;
    }

    .product {
      background: white;
      padding: 16px;
      margin-bottom: 12px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
    }

    .product h3 {
      margin-top: 0;
      margin-bottom: 5px;
    }

    .product p {
      margin: 5px 0;
    }

    .small {
      color: #777;
      font-size: 14px;
    }

    #addProductForm,
    #updateForm {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-top: 20px;
    }

    /* BARCODE SCANNER */

    #scannerContainer {
      display: none;
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-top: 20px;
      margin-bottom: 20px;
    }

    #scannerContainer h2 {
      margin-top: 0;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    #scannerStatus {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-bottom: 12px;
    }

    #closeScannerButton {
      background: #555;
    }

  </style>

</head>


<body>

<header>
  <h1>My Inventory</h1>
</header>


<div class="container">

  <input
    id="searchInput"
    type="text"
    placeholder="Search products..."
  >


  <button onclick="scanBarcode()">
    Scan Barcode
  </button>


  <button onclick="showAddProduct()">
    Add Product
  </button>


  <!-- BARCODE SCANNER -->

  <div
    id="scannerContainer"
  >

    <h2>Scan Barcode</h2>

    <div id="reader"></div>

    <div id="scannerStatus">
      Point your camera at a product barcode.
    </div>

    <button
      id="closeScannerButton"
      onclick="closeBarcodeScanner()"
    >
      Close Scanner
    </button>

  </div>


  <div class="categories">

    <button onclick="filterProducts('All')">
      All
    </button>

    <button onclick="filterProducts('Skincare')">
      Skincare
    </button>

    <button onclick="filterProducts('Makeup')">
      Makeup
    </button>

    <button onclick="filterProducts('Haircare')">
      Haircare
    </button>

  </div>


  <div id="productList"></div>


  <!-- ADD PRODUCT -->

  <div
    id="addProductForm"
    style="display:none;"
  >

    <h2>Add Product</h2>

    <input
      id="newName"
      type="text"
      placeholder="Product name"
    >

    <select id="newCategory">

      <option value="Skincare">
        Skincare
      </option>

      <option value="Makeup">
        Makeup
      </option>

      <option value="Haircare">
        Haircare
      </option>

    </select>

    <input
      id="newBarcode"
      type="text"
      placeholder="Barcode (optional)"
    >

    <input
      id="newStock"
      type="number"
      placeholder="Live stock"
    >

    <input
      id="newTester"
      type="number"
      placeholder="Testers"
    >

    <input
      id="newSamples"
      type="number"
      placeholder="Samples"
    >

    <input
      id="newLocation"
      type="text"
      placeholder="Location"
    >

    <button onclick="saveNewProduct()">
      Save Product
    </button>

    <button onclick="closeAddProduct()">
      Cancel
    </button>

  </div>


  <!-- UPDATE PRODUCT -->

  <div
    id="updateForm"
    style="display:none;"
  >

    <h2>Update Count</h2>

    <input
      id="updateStock"
      type="number"
      placeholder="Live stock"
    >

    <input
      id="updateTester"
      type="number"
      placeholder="Testers"
    >

    <input
      id="updateSamples"
      type="number"
      placeholder="Samples"
    >

    <input
      id="updateLocation"
      type="text"
      placeholder="Location"
    >

    <button onclick="saveUpdate()">
      Save Changes
    </button>

    <button
      onclick="deleteProduct()"
      style="background:#b00020;"
    >
      Delete Product
    </button>

    <button onclick="closeUpdate()">
      Cancel
    </button>

  </div>

</div>


<script>

  var currentProduct = null;
  var currentCategory = "All";

  /*
    BARCODE SCANNER VARIABLE
  */

  var barcodeScanner = null;
  var barcodeScannerRunning = false;
  var barcodeAlreadyFound = false;


  /*
    INITIAL PRODUCTS

    These are only used if there is no saved inventory yet.
  */

  var defaultProducts = [

    {
      id: "default-1",
      name: "Hydra Balance Serum",
      category: "Skincare",
      barcode: "",
      stock: "8",
      tester: "2",
      samples: "5",
      location: "Shelf A1"
    },

    {
      id: "default-2",
      name: "Velvet Skin Foundation",
      category: "Makeup",
      barcode: "",
      stock: "12",
      tester: "1",
      samples: "3",
      location: "Shelf B2"
    },

    {
      id: "default-3",
      name: "Nourishing Hair Mask",
      category: "Haircare",
      barcode: "",
      stock: "6",
      tester: "1",
      samples: "4",
      location: "Shelf C1"
    }

  ];


  /*
    LOAD INVENTORY
  */

  function getProducts() {

    var savedProducts =
      JSON.parse(localStorage.getItem("inventoryProducts"));

    if (!savedProducts) {

      savedProducts = defaultProducts;

      localStorage.setItem(
        "inventoryProducts",
        JSON.stringify(savedProducts)
      );

    }

    return savedProducts;

  }


  /*
    DISPLAY PRODUCTS
  */

  function renderProducts() {

    var productList =
      document.getElementById("productList");

    productList.innerHTML = "";

    var products = getProducts();

    var searchText =
      document.getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();


    products.forEach(function(product) {

      var nameMatches =
        product.name
          .toLowerCase()
          .includes(searchText);

      var categoryMatches =
        currentCategory === "All" ||
        product.category === currentCategory;


      if (!nameMatches || !categoryMatches) {
        return;
      }


      var productDiv =
        document.createElement("div");

      productDiv.className = "product";

      productDiv.setAttribute(
        "data-id",
        product.id
      );


      productDiv.innerHTML =

        "<h3>" +
        product.name +
        "</h3>" +

        "<p class='small'>" +
        product.category +
        "</p>" +

        "<p>Barcode: " +
        (product.barcode || "None") +
        "</p>" +

        "<p>Live Stock: " +
        product.stock +
        "</p>" +

        "<p>Testers: " +
        product.tester +
        "</p>" +

        "<p>Samples: " +
        product.samples +
        "</p>" +

        "<p>Location: " +
        product.location +
        "</p>" +

        "<p class='small'>Last checked: Today</p>" +

        "<button onclick='openUpdate(this.parentElement)'>" +
        "Update Count" +
        "</button>";


      productList.appendChild(productDiv);

    });

  }


  /*
    SEARCH
  */

  document
    .getElementById("searchInput")
    .addEventListener("input", function() {

      renderProducts();

    });


  /*
    CATEGORY FILTER
  */

  function filterProducts(category) {

    currentCategory = category;

    renderProducts();

  }


  /*
    ADD PRODUCT FORM
  */

  function showAddProduct() {

    document
      .getElementById("addProductForm")
      .style.display = "block";

  }


  function closeAddProduct() {

    document
      .getElementById("addProductForm")
      .style.display = "none";

  }


  /*
    SAVE NEW PRODUCT
  */

  function saveNewProduct() {

    var product = {

      id:
        "product-" +
        Date.now(),

      name:
        document.getElementById("newName").value.trim(),

      category:
        document.getElementById("newCategory").value,

      barcode:
        document.getElementById("newBarcode").value.trim(),

      stock:
        document.getElementById("newStock").value || "0",

      tester:
        document.getElementById("newTester").value || "0",

      samples:
        document.getElementById("newSamples").value || "0",

      location:
        document.getElementById("newLocation").value.trim() ||
        "Not specified"

    };


    if (product.name === "") {

      alert("Please enter a product name.");

      return;

    }


    var products = getProducts();


    /*
      Prevent duplicate barcode entries.
    */

    if (product.barcode !== "") {

      var duplicateBarcode =
        products.find(function(existingProduct) {

          return (
            existingProduct.barcode ===
            product.barcode
          );

        });


      if (duplicateBarcode) {

        alert(
          "A product with this barcode already exists."
        );

        return;

      }

    }


    products.push(product);


    localStorage.setItem(
      "inventoryProducts",
      JSON.stringify(products)
    );


    closeAddProduct();

    clearAddProductForm();

    renderProducts();


    alert("Product added!");

  }


  /*
    CLEAR ADD PRODUCT FORM
  */

  function clearAddProductForm() {

    document.getElementById("newName").value = "";

    document.getElementById("newBarcode").value = "";

    document.getElementById("newStock").value = "";

    document.getElementById("newTester").value = "";

    document.getElementById("newSamples").value = "";

    document.getElementById("newLocation").value = "";

  }


  /*
    GET PRODUCT VALUE
  */

  function getProductValue(product, label) {

    var paragraphs =
      product.querySelectorAll("p");


    for (
      var i = 0;
      i < paragraphs.length;
      i++
    ) {

      var text =
        paragraphs[i]
          .textContent
          .trim();


      if (text.startsWith(label)) {

        return text
          .replace(label, "")
          .trim();

      }

    }


    return "";

  }


  /*
    OPEN UPDATE FORM
  */

  function openUpdate(product) {

    currentProduct = product;


    document.getElementById("updateStock").value =
      getProductValue(
        product,
        "Live Stock:"
      );


    document.getElementById("updateTester").value =
      getProductValue(
        product,
        "Testers:"
      );


    document.getElementById("updateSamples").value =
      getProductValue(
        product,
        "Samples:"
      );


    document.getElementById("updateLocation").value =
      getProductValue(
        product,
        "Location:"
      );


    document
      .getElementById("updateForm")
      .style.display = "block";

  }


  /*
    SAVE UPDATED COUNT
  */

  function saveUpdate() {

    if (!currentProduct) {
      return;
    }


    var newStock =
      document.getElementById("updateStock").value || "0";


    var newTester =
      document.getElementById("updateTester").value || "0";


    var newSamples =
      document.getElementById("updateSamples").value || "0";


    var newLocation =
      document.getElementById("updateLocation").value.trim() ||
      "Not specified";


    var productId =
      currentProduct.getAttribute("data-id");


    var products = getProducts();


    var index =
      products.findIndex(function(product) {

        return product.id === productId;

      });


    if (index === -1) {

      alert("Product could not be found.");

      return;

    }


    products[index].stock =
      newStock;

    products[index].tester =
      newTester;

    products[index].samples =
      newSamples;

    products[index].location =
      newLocation;


    localStorage.setItem(
      "inventoryProducts",
      JSON.stringify(products)
    );


    closeUpdate();

    renderProducts();


    alert("Count updated!");

  }


  /*
    DELETE PRODUCT
  */

  function deleteProduct() {

    if (!currentProduct) {

      alert("No product selected.");

      return;

    }


    var productName =
      currentProduct
        .querySelector("h3")
        .textContent
        .trim();


    var productId =
      currentProduct.getAttribute("data-id");


    var confirmed =
      confirm(
        "Are you sure you want to delete " +
        productName +
        "?"
      );


    if (!confirmed) {

      return;

    }


    var products = getProducts();


    products =
      products.filter(function(product) {

        return product.id !== productId;

      });


    localStorage.setItem(
      "inventoryProducts",
      JSON.stringify(products)
    );


    currentProduct = null;

    closeUpdate();

    renderProducts();


    alert("Product deleted.");

  }


  /*
    CLOSE UPDATE FORM
  */

  function closeUpdate() {

    document
      .getElementById("updateForm")
      .style.display = "none";

    currentProduct = null;

  }


  /*
    BARCODE SCANNER
  */

  function scanBarcode() {

    if (typeof Html5Qrcode === "undefined") {

      alert(
        "The barcode scanner could not load. Please check your internet connection and try again."
      );

      return;

    }


    if (barcodeScannerRunning) {
      return;
    }


    barcodeAlreadyFound = false;


    document
      .getElementById("scannerContainer")
      .style.display = "block";


    document
      .getElementById("scannerStatus")
      .textContent =
      "Starting camera...";


    barcodeScanner =
      new Html5Qrcode("reader");


    var scannerConfig = {

      fps: 10,

      qrbox: function(
        viewfinderWidth,
        viewfinderHeight
      ) {

        var width =
          Math.floor(
            viewfinderWidth * 0.85
          );

        var height = 120;


        if (height > viewfinderHeight * 0.5) {

          height =
            Math.floor(
              viewfinderHeight * 0.5
            );

        }


        return {
          width: width,
          height: height
        };

      },

      aspectRatio: 1.7777778,

      formatsToSupport: [

        Html5QrcodeSupportedFormats.UPC_A,

        Html5QrcodeSupportedFormats.UPC_E,

        Html5QrcodeSupportedFormats.EAN_13,

        Html5QrcodeSupportedFormats.EAN_8,

        Html5QrcodeSupportedFormats.CODE_128,

        Html5QrcodeSupportedFormats.CODE_39

      ]

    };


    barcodeScanner
      .start(

        {
          facingMode: "environment"
        },

        scannerConfig,

        onBarcodeScanned,

        function(errorMessage) {

          /*
            Normal scan failures happen constantly
            while searching for a barcode.

            We intentionally do nothing here.
          */

        }

      )
      .then(function() {

        barcodeScannerRunning = true;

        document
          .getElementById("scannerStatus")
          .textContent =
          "Point your camera at a product barcode.";

      })
      .catch(function(error) {

        console.error(error);

        document
          .getElementById("scannerStatus")
          .textContent =
          "Could not start the camera.";

        alert(
          "The camera could not be started. Make sure you gave the browser camera permission and that the website is using HTTPS."
        );

        closeBarcodeScanner();

      });

  }


  /*
    BARCODE FOUND
  */

  function onBarcodeScanned(decodedText) {

    if (barcodeAlreadyFound) {
      return;
    }


    barcodeAlreadyFound = true;


    var scannedBarcode =
      decodedText.trim();


    document
      .getElementById("scannerStatus")
      .textContent =
      "Barcode found: " +
      scannedBarcode;


    stopBarcodeScanner()
      .then(function() {

        handleScannedBarcode(
          scannedBarcode
        );

      });

  }


  /*
    HANDLE SCANNED BARCODE
  */

  function handleScannedBarcode(
    scannedBarcode
  ) {

    var products =
      getProducts();


    var existingProduct =
      products.find(function(product) {

        return (
          product.barcode &&
          product.barcode.trim() ===
          scannedBarcode
        );

      });


    /*
      PRODUCT ALREADY EXISTS
    */

    if (existingProduct) {

      closeBarcodeScanner();


      var productCard =
        document.querySelector(
          '[data-id="' +
          existingProduct.id +
          '"]'
        );


      if (productCard) {

        openUpdate(productCard);

      } else {

        document.getElementById(
          "searchInput"
        ).value = "";

        currentCategory = "All";

        renderProducts();


        productCard =
          document.querySelector(
            '[data-id="' +
            existingProduct.id +
            '"]'
          );


        if (productCard) {

          openUpdate(productCard);

        }

      }


      alert(
        "Product found: " +
        existingProduct.name
      );


      return;

    }


    /*
      PRODUCT DOES NOT EXIST
    */

    closeBarcodeScanner();


    showAddProduct();


    document.getElementById(
      "newBarcode"
    ).value =
      scannedBarcode;


    document.getElementById(
      "newName"
    ).focus();


    alert(
      "New barcode found. Enter the product information and save it."
    );

  }


  /*
    STOP BARCODE SCANNER
  */

  function stopBarcodeScanner() {

    return new Promise(function(resolve) {

      if (
        !barcodeScanner ||
        !barcodeScannerRunning
      ) {

        barcodeScannerRunning = false;

        resolve();

        return;

      }


      barcodeScanner
        .stop()
        .then(function() {

          barcodeScannerRunning = false;

          barcodeScanner = null;

          document.getElementById(
            "reader"
          ).innerHTML = "";


          resolve();

        })
        .catch(function(error) {

          console.error(error);

          barcodeScannerRunning = false;

          barcodeScanner = null;

          document.getElementById(
            "reader"
          ).innerHTML = "";


          resolve();

        });

    });

  }


  /*
    CLOSE BARCODE SCANNER
  */

  function closeBarcodeScanner() {

    stopBarcodeScanner();


    document
      .getElementById("scannerContainer")
      .style.display = "none";


    document
      .getElementById("scannerStatus")
      .textContent =
      "Point your camera at a product barcode.";

  }


  /*
    INITIALIZE APP
  */

  window.addEventListener(
    "load",
    function() {

      var products = getProducts();


      /*
        Give older saved products an ID
        if they were created before IDs
        were added.
      */

      var changed = false;


      products.forEach(function(product) {

        if (!product.id) {

          product.id =
            "product-" +
            Date.now() +
            "-" +
            Math.random()
              .toString(36)
              .substring(2, 8);

          changed = true;

        }

      });


      if (changed) {

        localStorage.setItem(
          "inventoryProducts",
          JSON.stringify(products)
        );

      }


      renderProducts();

    }
  );

</script>


</body>

</html>
